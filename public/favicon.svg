<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Shield/Circle -->
  <circle cx="50" cy="50" r="48" fill="#0a0a0f" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="50" cy="50" r="42" fill="none" stroke="#f59e0b" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.6" />
  
  <!-- Outer Sacred Geometry Ring -->
  <ellipse cx="50" cy="50" rx="44" ry="18" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" transform="rotate(-25 50 50)" opacity="0.8" filter="url(#glow)" />
  
  <!-- Pyramid -->
  <polygon points="50,16 18,78 82,78" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#glow)" />
  <line x1="50" y1="16" x2="50" y2="78" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5" />
  <polygon points="50,28 28,72 72,72" fill="#111119" stroke="url(#goldGrad)" stroke-width="1" opacity="0.9" />

  <!-- The Glowing All-Seeing Eye -->
  <path d="M 36,52 Q 50,40 64,52 Q 50,64 36,52 Z" fill="#0a0a0f" stroke="url(#goldGrad)" stroke-width="1.5" filter="url(#glow)" />
  <circle cx="50" cy="52" r="4.5" fill="url(#goldGrad)" />
  <circle cx="50" cy="52" r="2" fill="#0a0a0f" />
  <circle cx="51" cy="51" r="0.8" fill="#ffffff" />

  <!-- Base Apex Star -->
  <polygon points="50,11 51.5,15 55,16 51.5,17 50,21 48.5,17 45,16 48.5,15" fill="#fef08a" />
</svg>
